<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blueprint viewer</title>
<link rel="stylesheet" href="bue-render/render.css">
<style>
  html,body{margin:0;height:100%;background:#1a1c1f;color:#ddd;font:14px system-ui,sans-serif}
  #tools{display:flex;flex-direction:column;gap:6px;padding:8px;box-sizing:border-box}
  #src{height:70px;resize:vertical}
  #row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #name{width:180px}
  #out{font:12px ui-monospace,monospace;color:#9ab;word-break:break-all}
  .hidden{display:none !important}
</style>
</head>
<body>
<div id="tools">
  <textarea id="src" placeholder="Wklej blueprint z UE (Ctrl+V)"></textarea>
  <div id="row">
    <input id="name" placeholder="nazwa (np. drzwi)">
    <button id="online"><b>Zapisz online i kopiuj krótki link</b></button>
    <button id="save">Pobierz .txt</button>
    <button id="gh">Dodaj plik na GitHubie</button>
    <button id="copy">Kopiuj link do Notion</button>
  </div>
  <div id="out"></div>
</div>
<div id="view"></div>
<script src="bue-render/render.js"></script>
<script>
const view = document.getElementById('view');
const tools = document.getElementById('tools');
const API = 'https://small-wood-f210.wiktor-olejniczak-kontakt.workers.dev'; // <- adres Workera Cloudflare, bez ukośnika na końcu

const b64u = {
  dec(s) { return Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)); }
};
async function unpack(s) {
  return new Response(new Blob([b64u.dec(s)]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function render(text, reserved) {
  view.replaceChildren();
  new window.blueprintUE.render.Main(text, view, { height: (innerHeight - reserved) + 'px' }).start();
}
function fail(msg) { view.textContent = msg; }

const params = new URLSearchParams(location.search);
const name = params.get('bp');
const id = params.get('id');
const packed = params.get('d') || new URLSearchParams(location.hash.slice(1)).get('d');

if (name) {
  tools.classList.add('hidden');
  if (!/^[\w-]+$/.test(name)) fail('Niepoprawna nazwa');
  else fetch(`bp/${name}.txt`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => render(t, 0))
    .catch(e => fail('Nie wczytano: ' + e.message));
} else if (id) {
  tools.classList.add('hidden');
  if (!/^[a-f0-9]{12}$/.test(id)) fail('Niepoprawne id');
  else fetch(`${API}/api/${id}`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => render(t, 0))
    .catch(e => fail('Nie wczytano: ' + e.message));
} else if (packed) {
  tools.classList.add('hidden');
  unpack(packed).then(t => render(t, 0)).catch(e => fail('Niepoprawny link: ' + e.message));
} else if (window.self !== window.top) {
  tools.classList.add('hidden');
  fail('Brak blueprintu w linku (użyj ?id=… lub ?bp=nazwa)');
} else {
  const src = document.getElementById('src');
  const nameEl = document.getElementById('name');
  const out = document.getElementById('out');
  const slug = () => nameEl.value.trim().toLowerCase().replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '');
  const base = location.origin + location.pathname;
  const owner = location.hostname.split('.')[0];
  const repo = location.pathname.split('/')[1] || '';
  const shortLink = () => `${base}?bp=${slug()}`;

  src.addEventListener('input', () => render(src.value, tools.offsetHeight));
  nameEl.addEventListener('input', () => {
    out.textContent = slug() ? `Plik: bp/${slug()}.txt  →  ${shortLink()}` : '';
  });
  document.getElementById('online').onclick = async () => {
    if (!src.value.trim()) { out.textContent = 'Najpierw wklej blueprint.'; return; }
    if (API.includes('TWOJ-WORKER')) { out.textContent = 'Ustaw adres Workera w stałej API na górze skryptu.'; return; }
    let token = localStorage.getItem('bp_token');
    if (!token) {
      token = (prompt('Podaj TOKEN z Cloudflare (zapamiętam go w tej przeglądarce):') || '').trim();
      if (!token) return;
      localStorage.setItem('bp_token', token);
    }
    out.textContent = 'Zapisuję…';
    try {
      const r = await fetch(`${API}/api`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'text/plain' },
        body: src.value
      });
      if (r.status === 401) { localStorage.removeItem('bp_token'); throw new Error('zły token, spróbuj ponownie'); }
      if (!r.ok) throw new Error(r.status);
      const { id } = await r.json();
      const link = `${base}?id=${id}`;
      await navigator.clipboard.writeText(link).catch(() => {});
      out.textContent = `Gotowe (skopiowano): ${link}`;
    } catch (e) { out.textContent = 'Błąd: ' + e.message; }
  };
  document.getElementById('save').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([src.value], { type: 'text/plain' }));
    a.download = (slug() || 'blueprint') + '.txt';
    a.click();
  };
  document.getElementById('gh').onclick = () => {
    window.open(`https://github.com/${owner}/${repo}/upload/main/bp`, '_blank');
  };
  document.getElementById('copy').onclick = async () => {
    if (!slug()) { out.textContent = 'Najpierw wpisz nazwę.'; return; }
    await navigator.clipboard.writeText(shortLink());
    out.textContent = `Skopiowano: ${shortLink()}  (plik bp/${slug()}.txt musi być w repo)`;
  };
}
</script>
</body>
</html>
